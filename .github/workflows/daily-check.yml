name: Daily grad programme check

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tracker
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          DIGEST_TO: ${{ secrets.GMAIL_USER }}
        run: python src/main.py

      - name: Build dashboard
        run: python src/dashboard.py

      - name: Commit updated state
        run: |
          git config user.name "grad-program-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json data/alerts_history.json docs/
          git diff --cached --quiet || git commit -m "Update state and dashboard [skip ci]"
          git push
