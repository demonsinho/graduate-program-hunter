# Grad Program Hunter — firm/location tracking config
#
# Each firm has a tier (informational, from the user's original ranking) and
# a list of locations to track. Every career_url is a best-effort guess at
# the firm's early-careers / graduate-programme landing page (programme-
# specific "Summer 2027" URLs don't exist yet — they appear once a
# programme opens, which is exactly what this tool is watching for).
#
# `verify: true` means the URL has NOT been live-checked yet — it may be
# stale, redirected, or wrong. Check it once and either fix the URL or
# remove the `verify` flag. The scraper will still run against verify:true
# entries; a broken one just shows up in the "needs manual check" digest
# section instead of crashing the run.

